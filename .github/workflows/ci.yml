name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # The kernel must load under Node too (the Pi host imports it in-process).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (YAML safety and typecheck)
        run: bun run lint

      - name: Test
        run: bun run test

      # The marketplace installs the plugin straight from git, so its bundles must match the sources.
      - name: Plugin bundles are up to date
        run: bun run build:plugin:check

      # The same end-to-end runs, with every hook going through the launcher and the committed bundle.
      - name: End-to-end through the shipped plugin
        run: bun test ./tests/e2e
        env:
          AOS_E2E_HOOK: bundle

  # The docs site deploys from main on its own, so a broken build or link must fail here, before merge.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build the site
        working-directory: site
        run: bun run build

      - name: Every link and redirect resolves, and every 1.0 doc is rendered
        working-directory: site
        run: bun run check:built

      # The deploy builds this image, not the step above; a base-image or lockfile problem shows only here.
      - name: Build the deploy image
        run: docker build -f site/Dockerfile -t aos-site:ci .

  # What a release ships: one version across manifests, loadable packs, a marketplace entry that resolves.
  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release configs
        run: bun run validate:configs
