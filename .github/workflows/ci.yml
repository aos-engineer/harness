name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # The kernel must load under Node too (the Pi host imports it in-process).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (YAML safety and typecheck)
        run: bun run lint

      - name: Test
        run: bun run test

      # The marketplace installs the plugin straight from git, so its bundles must match the sources.
      - name: Plugin bundles are up to date
        run: bun run build:plugin:check
