name: release

# Pushing a v<semver> tag on main publishes the `aos-harness` CLI to npm and creates the GitHub release.
# A prerelease version (anything with a hyphen, e.g. 1.0.0-next.0) goes to the npm `next` dist-tag and is
# marked as a prerelease on GitHub, so `latest` never moves by accident. The Claude Code plugin ships from
# the repository itself through .claude-plugin/marketplace.json, at the version in its plugin.json.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm trusted publishing: npm trades this job's OIDC token for a short-lived publish credential, and
  # links each published version to this workflow run as provenance.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # No registry-url: it writes an .npmrc that expects a token, and publishing here uses none.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify the tag, the branch, and every version
        run: bun run scripts/release/verify-tag.ts

      # Before anything is published: a missing section found after `npm publish` would fail the job with
      # the package already on npm, and a published version number can never be reused.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" || { echo "CHANGELOG.md has no notes for $VER"; exit 1; }

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Plugin bundles match the sources
        run: bun run build:plugin:check

      # The same end-to-end runs, with every hook going through the launcher and the committed bundle.
      - name: End-to-end through the shipped plugin
        run: bun test ./tests/e2e
        env:
          AOS_E2E_HOOK: bundle

      - name: Packs and the marketplace entry are valid
        run: bun run validate:configs

      - name: Pack the CLI
        run: bun run scripts/release/pack-cli.ts "$RUNNER_TEMP/npm"

      - name: Smoke the packed CLI
        run: bun "$RUNNER_TEMP/npm/aos-harness/dist/aos.js" --version

      - name: Choose the npm dist-tag
        id: disttag
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "tag=next" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi

      # Trusted publishing needs npm 11.5.1 or later; pinned so a release never depends on whichever npm
      # the runner's Node happens to bundle.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11.21.1 && npm --version

      # Trusted publishing: the aos-harness package on npmjs.com trusts this repository's release.yml in
      # the npm-publish environment, so no long-lived token exists to leak or expire.
      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP/npm/aos-harness" --access public --tag "${{ steps.disttag.outputs.tag }}" --provenance

      - name: Wait for the registry, then install and run it
        run: bun run scripts/release/wait-for-npm.ts aos-harness "${GITHUB_REF_NAME#v}" "${{ steps.disttag.outputs.tag }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # notes.md is the CHANGELOG section extracted before publishing.
          PRE=""; [[ "$VER" == *-* ]] && PRE="--prerelease"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $PRE
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" $PRE
          fi
