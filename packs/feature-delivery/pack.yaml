# feature-delivery reference pack. Data only: packs never run code. Binds only public skills; personal bindings belong in overlays.
# Starting values, to be tuned from dogfood logs: classify keywords, roles, deploy patterns, budget.
# Classify rules favor strong signals. This pack defines no architectural tier, so a false architectural
# match blocks a run from starting, while a miss still runs bounded: design approval, tests, and review.
name: feature-delivery
version: 1.0.0

roles:
  test: ["bun test", "bun run test", "npm test", "npm run test", "pnpm test", "yarn test", "pytest", "go test", "cargo test"]

classify:
  rules:
    - tier: architectural
      any: ['\b(database|db|data)\s+schema\b', '\bschema\s+(change|migration)s?\b', '\bmigrations?\b', '\b(authentication|authorization|oauth2?|auth0|authn|authz|sso)\b', '\bpublic api\b', '\bnew service\b']
    - tier: spike
      any: ['\bspike\b', '\bfeasibility\b', '\bprototype\b', '\bthrowaway\b', '\bis it possible\b']
  default: bounded

budget:
  iterations: 20

tiers:
  spike:
    stages:
      - name: frame
        writes: []
        bind: ["superpowers:brainstorming"]
        model: reasoning
        gate: { decider: human }
      - name: probe
        writes: any
        model: fast
        gate: { decider: rule }
  bounded:
    stages:
      - name: design
        writes: ["docs/specs/"]
        bind: ["superpowers:brainstorming"]
        model: reasoning
        gate: { decider: human }
      - name: build
        writes: any
        bind: ["superpowers:test-driven-development"]
        model: fast
        gate:
          decider: rule
          tasks: all
          requires:
            - { kind: command, role: test, result: exit_zero, provenance: observed, fresh: true }
      - name: verify
        writes: any
        bind: ["superpowers:verification-before-completion", "superpowers:requesting-code-review"]
        model: reasoning
        gate:
          decider: rule
          requires:
            - { kind: command, role: test, result: exit_zero, provenance: observed, fresh: true }
            - { kind: review, status: approved, provenance: claimed, fresh: true }

actions:
  commit:
    patterns: ['^git(\s+(-[cC]\s+\S+|--\S+))*\s+commit\b']
    policy: { spike: { allow: always }, bounded: { allow: in_stages, stages: [build, verify] } }
  push:
    patterns: ['^git(\s+(-[cC]\s+\S+|--\S+))*\s+push\b']
    policy: { spike: { allow: never }, bounded: { allow: after_gate, gate: verify } }
  pr_create:
    patterns: ['^gh\s+pr\s+create\b']
    policy: { spike: { allow: never }, bounded: { allow: after_gate, gate: verify } }
  deploy:
    patterns: ['^(vercel|netlify|flyctl|fly)\s+deploy\b', '^kubectl\s+(apply|rollout)\b', '^terraform\s+apply\b', '^helm\s+(install|upgrade)\b', '\bdokploy\b', '^gh\s+workflow\s+run\b']
    policy: { spike: { allow: never }, bounded: { allow: never } }
